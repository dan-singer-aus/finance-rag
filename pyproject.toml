[project]
name = "finance-rag"
version = "0.1.0"
description = "Stage 2 — source-grounded RAG over company filings + Buffett shareholder letters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.4.0",
    "openai>=2.38.0",
    "python-dotenv>=1.2.1",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "mypy>=2.3.1",
    "pypdf>=6.14.2",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.uv]
# Not a distributable package — just an env + deps. Run modules with `uv run`.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["db", "domain", "ingest", "embedding.py", "scripts"]

# Every function must be annotated, and bodies are checked rather than skipped.
# Without these two, mypy silently ignores any function missing annotations —
# which would have let both of this session's type bugs through.
disallow_untyped_defs = true
check_untyped_defs = true

# `x: int = None` is an error rather than an implicit Optional.
no_implicit_optional = true
strict_equality = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# python-frontmatter ships no type information; its metadata is dict[str, Any]
# by nature, which is exactly why parse_document exists as a typed boundary.
[[tool.mypy.overrides]]
module = ["frontmatter.*"]
ignore_missing_imports = true
