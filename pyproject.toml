[project]
name = "finance-rag"
version = "0.1.0"
description = "Stage 2 — source-grounded RAG over company filings + Buffett shareholder letters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.4.0",
    "openai>=2.38.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "pypdf>=6.14.2",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.uv]
# Not a distributable package — just an env + deps. Run modules with `uv run`.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
