services:
  db:
    image: pgvector/pgvector:pg17
    container_name: finance-rag-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_rag
    ports:
      # 5432 and 5433 are taken by the Monthly Giving containers on this machine.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Browser GUI at http://localhost:8081 — table browser + query tab.
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: finance-rag-pgweb
    environment:
      # Reached over the compose network, so the host is the SERVICE NAME `db`
      # on its INTERNAL port 5432 — not localhost:5434, which is the mapping
      # for tools running outside Docker (psql, psycopg, the app).
      DATABASE_URL: postgres://postgres:postgres@db:5432/finance_rag?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
