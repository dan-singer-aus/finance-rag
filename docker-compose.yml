services:
  db:
    image: pgvector/pgvector:pg17
    container_name: finance-rag-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_rag
    ports:
      # 5432 and 5433 are taken by the Monthly Giving containers on this machine.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
